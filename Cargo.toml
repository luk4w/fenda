[workspace]
resolver = "2"
members = ["crates/fnd", "crates/models", "crates/fenda"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
fnd = { path = "crates/fnd" }
models = { path = "crates/models" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
clap = { version = "4.5.20", features = ["derive"] }
regex = "1.11.0"
ort = "=2.0.0-rc.14"
ureq = "2.12"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
